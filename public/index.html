<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE Messenger</title>
    <style>
        * { box-sizing: border-box; }
        body, html { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1f1b24; color: #f3e5f5; margin: 0; padding: 0; height: 100%; overflow: hidden; }
        
        /* Login Screen (Romantic Vibe) */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #4a1525, #2d1b36); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .auth-box { background: rgba(35, 20, 40, 0.95); padding: 35px; border-radius: 16px; width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(233, 30, 99, 0.3); }
        .auth-box h2 { color: #ff4081; margin-bottom: 25px; font-size: 26px; letter-spacing: 1px; }
        .auth-box input { width: 100%; padding: 12px 15px; margin-bottom: 15px; background: #2a1b30; border: 1px solid #5d3a6e; border-radius: 8px; color: white; font-size: 15px; outline: none; }
        .auth-box input:focus { border-color: #ff4081; }
        .auth-box button { width: 100%; padding: 12px; background: linear-gradient(135deg, #ff4081, #c51162); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .auth-box button:hover { opacity: 0.9; }

        /* App Screen */
        #app-screen { display: none; width: 100vw; height: 100vh; flex-direction: row; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: 300px; background: #23192f; border-right: 1px solid #3d2a4f; display: flex; flex-direction: column; height: 100%; }
        .sidebar-top { padding: 15px 20px; background: #2a1b3a; font-weight: bold; border-bottom: 1px solid #3d2a4f; display: flex; justify-content: space-between; align-items: center; color: #ff80ab; flex-shrink: 0; }
        #user-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        .contact { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; font-size: 15px; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .contact:hover, .contact.active { background: #322142; color: #ff4081; }

        /* Chat Area */
        #chat-area { flex: 1; display: flex; flex-direction: column; height: 100%; background: #181020; overflow: hidden; position: relative; }
        
        /* Fixed Header */
        .chat-header { padding: 12px 20px; background: #23192f; border-bottom: 1px solid #3d2a4f; font-weight: bold; font-size: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; color: #f3e5f5; }
        .header-left { display: flex; align-items: center; }
        .header-actions { display: flex; gap: 15px; }
        .call-btn { background: none; border: none; font-size: 20px; cursor: pointer; transition: 0.2s; }
        .call-btn:hover { transform: scale(1.1); }
        
        #no-chat { flex: 1; display: flex; justify-content: center; align-items: center; color: #9c88b1; font-size: 16px; text-align: center; padding: 20px; }
        
        #active-chat { display: none; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }
        
        /* Scrollable Messages Area */
        #messages { flex: 1; padding: 20px; overflow-y: auto; list-style: none; margin: 0; display: flex; flex-direction: column; gap: 12px; }
        
        .msg { max-width: 65%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-all; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .msg.incoming { background: #2a1b3a; color: #f3e5f5; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg.outgoing { background: linear-gradient(135deg, #c51162, #880e4f); color: #ffffff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg span { display: block; font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 4px; text-align: right; }

        /* Love Frame for Photos */
        .love-frame {
            border: 4px solid #ff4081;
            padding: 5px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.6);
            max-width: 220px;
            display: inline-block;
            margin-top: 5px;
        }
        .love-frame img, .love-frame video {
            width: 100%;
            border-radius: 8px;
            display: block;
        }

        /* Fixed Bottom Input Form */
        #form { padding: 12px 20px; background: #23192f; display: flex; align-items: center; gap: 10px; border-top: 1px solid #3d2a4f; flex-shrink: 0; }
        .attachment-buttons { display: flex; gap: 8px; }
        .attach-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #ff80ab; transition: 0.2s; }
        .attach-btn:hover { color: #ff4081; }
        
        #input { flex: 1; padding: 10px 16px; border: 1px solid #3d2a4f; border-radius: 24px; outline: none; font-size: 14px; background: #1a1024; color: white; }
        #input:focus { border-color: #ff4081; }
        #form button[type="submit"] { padding: 10px 20px; background: #ff4081; border: none; color: white; font-weight: bold; border-radius: 24px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        #form button[type="submit"]:hover { background: #e91e63; }

        /* Romantic Calling Overlay UI */
        #call-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #4a1525 0%, #1a0d18 100%); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 200; color: white; text-align: center; }
        .caller-heart { font-size: 70px; animation: pulseBeat 1.2s infinite; margin-bottom: 20px; text-shadow: 0 0 20px #ff4081; }
        @keyframes pulseBeat { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
        .call-actions { display: flex; gap: 30px; margin-top: 40px; }
        .call-action-btn { width: 65px; height: 65px; border-radius: 50%; border: none; font-size: 24px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .accept-call { background: #4caf50; color: white; }
        .reject-call { background: #f44336; color: white; }

        @media(max-width: 768px) {
            #sidebar { width: 100%; position: absolute; height: 100%; z-index: 10; }
            #sidebar.hidden { display: none; }
            #chat-area { width: 100%; height: 100%; position: absolute; }
        }
    </style>
</head>
<body>

    <!-- Login -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>ONE Messenger</h2>
            <form id="auth-form">
                <input type="text" id="username" placeholder="Username" required autocomplete="off" />
                <input type="password" id="password" placeholder="Password" required />
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <!-- Romantic Calling Screen Overlay -->
    <div id="call-overlay">
        <div class="caller-heart">💖</div>
        <h2 id="call-status-text" style="color: #ff80ab; margin-bottom: 10px;">Incoming Love Call...</h2>
        <p id="caller-name" style="font-size: 22px; font-weight: bold;"></p>
        <div class="call-actions">
            <button class="call-action-btn accept-call" onclick="answerCall()">📞</button>
            <button class="call-action-btn reject-call" onclick="endCallOverlay()">❌</button>
        </div>
    </div>

    <!-- App -->
    <div id="app-screen">
        <div id="sidebar">
            <div class="sidebar-top">
                <span id="my-name">Contacts</span>
                <button onclick="location.reload()" style="background:transparent; border:1px solid #ff4081; color:#ff4081; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px;">Logout</button>
            </div>
            <ul id="user-list"></ul>
        </div>

        <div id="chat-area">
            <div id="no-chat">
                <p>💖 Left side se contact select karke baatein shuru karein...</p>
            </div>

            <div id="active-chat">
                <div class="chat-header">
                    <div class="header-left">
                        <button id="back-btn" onclick="goBack()" style="display:none; margin-right:12px; background:none; border:none; color:white; font-size:18px; cursor:pointer;">⬅️</button>
                        <span id="chat-title">Chat</span>
                    </div>
                    <div class="header-actions">
                        <button class="call-btn" onclick="triggerCall('audio')" title="Audio Call">📞</button>
                        <button class="call-btn" onclick="triggerCall('video')" title="Video Call">📹</button>
                    </div>
                </div>
                
                <!-- Scrollable Messages -->
                <ul id="messages"></ul>

                <!-- Fixed Input Form with Attachments -->
                <form id="form">
                    <div class="attachment-buttons">
                        <label class="attach-btn" title="Share Photo">📷<input type="file" accept="image/*" id="photo-input" style="display:none" onchange="sendFile(this, 'image')"></label>
                        <label class="attach-btn" title="Share Video">🎥<input type="file" accept="video/*" id="video-input" style="display:none" onchange="sendFile(this, 'video')"></label>
                        <label class="attach-btn" title="Share File">📎<input type="file" id="file-input" style="display:none" onchange="sendFile(this, 'file')"></label>
                        <button type="button" class="attach-btn" onclick="toggleVoiceRecord()" title="Voice Note">🎙️</button>
                    </div>
                    <input id="input" autocomplete="off" placeholder="Type a message..." required />
                    <button type="submit">SEND</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myName = '';
        let targetSocketId = null;
        let histories = {};
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];

        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const authForm = document.getElementById('auth-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        
        const userList = document.getElementById('user-list');
        const noChat = document.getElementById('no-chat');
        const activeChat = document.getElementById('active-chat');
        const chatTitle = document.getElementById('chat-title');
        const messages = document.getElementById('messages');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const sidebar = document.getElementById('sidebar');
        const backBtn = document.getElementById('back-btn');
        const callOverlay = document.getElementById('call-overlay');

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            myName = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            socket.emit('register', { username: myName, password }, (res) => {
                if (res.success) {
                    authScreen.style.display = 'none';
                    appScreen.style.display = 'flex';
                    document.getElementById('my-name').textContent = myName;
                } else {
                    alert(res.message);
                }
            });
        });

        socket.on('update_users', (usersMap) => {
            userList.innerHTML = '';
            for (let sId in usersMap) {
                if (usersMap[sId] === myName) continue;
                const li = document.createElement('li');
                li.className = 'contact';
                li.innerHTML = `💕 <span>${usersMap[sId]}</span>`;
                li.onclick = () => {
                    targetSocketId = sId;
                    chatTitle.textContent = usersMap[sId];
                    noChat.style.display = 'none';
                    activeChat.style.display = 'flex';
                    if (window.innerWidth <= 768) {
                        sidebar.classList.add('hidden');
                        backBtn.style.display = 'inline-block';
                    }
                    renderMsgs();
                };
                userList.appendChild(li);
            }
        });

        function goBack() {
            sidebar.classList.remove('hidden');
            activeChat.style.display = 'none';
            noChat.style.display = 'flex';
            targetSocketId = null;
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const txt = input.value.trim();
            if (txt && targetSocketId) {
                appendAndSend({ type: 'text', content: txt });
                input.value = '';
            }
        });

        function appendAndSend(msgObj) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            msgObj.sender = myName;
            msgObj.time = time;

            if (!histories[targetSocketId]) histories[targetSocketId] = [];
            histories[targetSocketId].push(msgObj);

            socket.emit('private_message', { toSocketId: targetSocketId, messageObj: msgObj, sender: myName });
            renderMsgs();
        }

        socket.on('private_message', ({ messageObj, fromSocketId }) => {
            if (!histories[fromSocketId]) histories[fromSocketId] = [];
            histories[fromSocketId].push(messageObj);

            if (targetSocketId === fromSocketId) {
                renderMsgs();
            }
        });

        function sendFile(inputElement, type) {
            const file = inputElement.files[0];
            if (!file || !targetSocketId) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                let contentHTML = '';
                if (type === 'image') {
                    contentHTML = `<div class="love-frame"><img src="${e.target.result}" /></div>`;
                } else if (type === 'video') {
                    contentHTML = `<div class="love-frame"><video src="${e.target.result}" controls></video></div>`;
                } else {
                    contentHTML = `<a href="${e.target.result}" download="${file.name}" style="color:#ff80ab;">📎 ${file.name}</a>`;
                }
                appendAndSend({ type: 'html', content: contentHTML });
            };
            reader.readAsDataURL(file);
        }

        // Voice note recording simulation
        async function toggleVoiceRecord() {
            if (!targetSocketId) { alert('Pehle contact select karein!'); return; }
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        appendAndSend({ type: 'html', content: `<audio controls src="${audioUrl}"></audio>` });
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    event.target.style.color = 'red';
                } catch(err) {
                    alert('Mic access nahi mila!');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                event.target.style.color = '#ff80ab';
            }
        }

        // Call Features UI
        function triggerCall(type) {
            if (!targetSocketId) return;
            document.getElementById('caller-name').textContent = chatTitle.textContent;
            document.getElementById('call-status-text').textContent = `Calling with Love (${type.toUpperCase()})...`;
            callOverlay.style.display = 'flex';
        }

        function answerCall() {
            alert('Call Connected with Love ❤️');
            callOverlay.style.display = 'none';
        }

        function endCallOverlay() {
            callOverlay.style.display = 'none';
        }

        function renderMsgs() {
            messages.innerHTML = '';
            if (!targetSocketId || !histories[targetSocketId]) return;
            histories[targetSocketId].forEach(m => {
                const li = document.createElement('li');
                li.className = m.sender === myName ? 'msg outgoing' : 'msg incoming';
                li.innerHTML = `${m.content}<span>${m.time}</span>`;
                messages.appendChild(li);
            });
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
