<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PK Classic Messenger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #efeae2; color: #111b21; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Classic Login Screen (No Hint) */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #00a884; display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .auth-card { background: #ffffff; padding: 35px 25px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .auth-card h2 { color: #00a884; margin-bottom: 25px; font-size: 26px; }
        .auth-card input { width: 100%; padding: 14px; margin-bottom: 15px; background: #f0f2f5; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 16px; outline: none; }
        .auth-card input:focus { border-color: #00a884; }
        .auth-card button { width: 100%; padding: 14px; background: #00a884; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        .auth-card button:hover { background: #019574; }

        /* Main App Screen (Classic Split Layout for Mobile/Desktop) */
        #app-screen { display: none; height: 100vh; flex-direction: row; background: #f0f2f5; }
        
        /* Left Sidebar: Contacts List */
        #sidebar { width: 320px; background: #ffffff; border-right: 1px solid #d1d7db; display: flex; flex-direction: column; height: 100%; }
        .sidebar-header { padding: 15px 20px; background: #f0f2f5; border-bottom: 1px solid #d1d7db; font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; align-items: center; color: #41525d; }
        #user-list { list-style: none; overflow-y: auto; flex: 1; }
        .contact-item { padding: 15px 20px; border-bottom: 1px solid #f0f2f5; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; }
        .contact-item:hover, .contact-item.active { background: #f0f2f5; }
        .contact-avatar { width: 42px; height: 42px; background: #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; flex-shrink: 0; }
        .contact-info h4 { font-size: 16px; color: #111b21; margin-bottom: 2px; }
        .contact-info span { font-size: 13px; color: #667781; }

        /* Right Area: Chat Window */
        #chat-window { flex: 1; display: flex; flex-direction: column; height: 100%; background: #efeae2; position: relative; }
        .chat-header { padding: 12px 20px; background: #f0f2f5; border-bottom: 1px solid #d1d7db; display: flex; align-items: center; justify-content: space-between; height: 60px; }
        .chat-header-info { display: flex; align-items: center; gap: 12px; }
        .chat-header-info h3 { font-size: 16px; color: #111b21; }
        
        #no-chat-selected { flex: 1; display: flex; justify-content: center; align-items: center; color: #667781; font-size: 16px; text-align: center; padding: 20px; }
        
        #active-chat-container { display: none; flex: 1; flex-direction: column; height: 100%; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; list-style: none; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { max-width: 65%; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-break: break-all; position: relative; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
        .msg.incoming { background: #ffffff; color: #111b21; align-self: flex-start; border-top-left-radius: 0; }
        .msg.outgoing { background: #d9fdd3; color: #111b21; align-self: flex-end; border-top-right-radius: 0; }
        .msg .time { font-size: 10px; color: #667781; float: right; margin-left: 10px; margin-top: 4px; }

        /* Classic Bottom Input Bar */
        #form { padding: 10px 20px; background: #f0f2f5; display: flex; align-items: center; gap: 12px; border-top: 1px solid #d1d7db; }
        #input { flex: 1; padding: 12px 16px; background: #ffffff; border: none; border-radius: 8px; font-size: 15px; outline: none; color: #111b21; }
        #form button { background: #00a884; border: none; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; font-size: 18px; flex-shrink: 0; }
        #form button:hover { background: #019574; }

        /* Responsive Mobile View handling */
        @media(max-width: 768px) {
            #app-screen { position: relative; }
            #sidebar { width: 100%; position: absolute; left: 0; top: 0; z-index: 10; transition: 0.3s; }
            #sidebar.hidden { transform: translateX(-100%); }
            #chat-window { width: 100%; position: absolute; left: 0; top: 0; height: 100%; z-index: 5; }
        }
    </style>
</head>
<body>

    <!-- Login Screen (No Hint) -->
    <div id="auth-screen">
        <div class="auth-card">
            <h2>PK Messenger</h2>
            <form id="auth-form">
                <input type="text" id="username" placeholder="Apna Naam (Username)" required autocomplete="off" />
                <input type="password" id="password" placeholder="Secret Password" required />
                <button type="submit">Login Karein</button>
            </form>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen">
        <!-- Sidebar Contacts -->
        <div id="sidebar">
            <div class="sidebar-header">
                <span id="my-profile-name">Contacts</span>
                <button onclick="location.reload()" style="background:none; border:none; color: #c91c1c; font-size:14px; cursor:pointer; font-weight:bold;">Logout</button>
            </div>
            <ul id="user-list">
                <!-- Contacts will load here -->
            </ul>
        </div>

        <!-- Chat Window -->
        <div id="chat-window">
            <div id="no-chat-selected">
                <p>💬 Kisi bhi contact par click karein aur personal chat shuru karein.</p>
            </div>

            <div id="active-chat-container">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <button id="back-btn" onclick="backToContacts()" style="display:none; background:none; border:none; font-size:20px; cursor:pointer; margin-right:5px;">⬅️</button>
                        <div class="contact-avatar" id="active-avatar">P</div>
                        <h3 id="active-chat-name">Chat Room</h3>
                    </div>
                </div>

                <ul id="messages"></ul>

                <form id="form">
                    <input id="input" autocomplete="off" placeholder="Message likhein..." required />
                    <button type="submit">➤</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = '';
        let activePeerSocketId = null;
        let allUsersData = {};
        // Store messages per user: { socketId: [ {sender, message, time} ] }
        let chatHistories = {};

        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const authForm = document.getElementById('auth-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        
        const userList = document.getElementById('user-list');
        const noChatSelected = document.getElementById('no-chat-selected');
        const activeChatContainer = document.getElementById('active-chat-container');
        const activeChatName = document.getElementById('active-chat-name');
        const activeAvatar = document.getElementById('active-avatar');
        const messages = document.getElementById('messages');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const sidebar = document.getElementById('sidebar');
        const backBtn = document.getElementById('back-btn');

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            myUsername = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            socket.emit('register', { username: myUsername, password }, (res) => {
                if (res.success) {
                    authScreen.style.display = 'none';
                    appScreen.style.display = 'flex';
                    document.getElementById('my-profile-name').textContent = `Aap: ${myUsername}`;
                } else {
                    alert(res.message);
                }
            });
        });

        // Update contacts list when someone joins or leaves
        socket.on('update_users', (usersMap) => {
            allUsersData = usersMap;
            userList.innerHTML = '';

            for (let sId in usersMap) {
                if (usersMap[sId] === myUsername) continue; // Don't show self

                const li = document.createElement('li');
                li.className = `contact-item ${activePeerSocketId === sId ? 'active' : ''}`;
                li.onclick = () => selectContact(sId, usersMap[sId]);

                li.innerHTML = `
                    <div class="contact-avatar">${usersMap[sId].substring(0, 2).toUpperCase()}</div>
                    <div class="contact-info">
                        <h4>${usersMap[sId]}</h4>
                        <span>Online</span>
                    </div>
                `;
                userList.appendChild(li);
            }
        });

        function selectContact(socketId, username) {
            activePeerSocketId = socketId;
            activeChatName.textContent = username;
            activeAvatar.textContent = username.substring(0, 2).toUpperCase();

            noChatSelected.style.display = 'none';
            activeChatContainer.style.display = 'flex';

            if (window.innerWidth <= 768) {
                sidebar.classList.add('hidden');
                backBtn.style.display = 'inline-block';
            }

            renderMessages();
        }

        function backToContacts() {
            sidebar.classList.remove('hidden');
            activeChatContainer.style.display = 'none';
            noChatSelected.style.display = 'flex';
            activePeerSocketId = null;
        }

        // Send Private Message
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (text && activePeerSocketId) {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // Save locally
                if (!chatHistories[activePeerSocketId]) chatHistories[activePeerSocketId] = [];
                chatHistories[activePeerSocketId].push({ sender: myUsername, message: text, time });

                socket.emit('private_message', { toSocketId: activePeerSocketId, message: text, sender: myUsername });
                
                input.value = '';
                renderMessages();
            }
        });

        // Receive Private Message
        socket.on('private_message', ({ sender, message, fromSocketId }) => {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (!chatHistories[fromSocketId]) chatHistories[fromSocketId] = [];
            chatHistories[fromSocketId].push({ sender, message, time });

            // If currently chatting with this person, update screen immediately
            if (activePeerSocketId === fromSocketId) {
                renderMessages();
            } else {
                // Optional: alert or notification sound indicator can go here
            }
        });

        function renderMessages() {
            messages.innerHTML = '';
            if (!activePeerSocketId || !chatHistories[activePeerSocketId]) return;

            chatHistories[activePeerSocketId].forEach(msg => {
                const li = document.createElement('li');
                li.className = msg.sender === myUsername ? 'msg outgoing' : 'msg incoming';
                li.innerHTML = `${msg.message}<span class="time">${msg.time}</span>`;
                messages.appendChild(li);
            });
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
