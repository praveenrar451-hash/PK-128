<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PK Telegram Style Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0f141c; color: #f1f5f9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Login Screen */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f141c; display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .auth-box { background: #17212b; padding: 30px 20px; border-radius: 16px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .auth-box h2 { color: #5288c1; margin-bottom: 8px; font-size: 24px; }
        .auth-box p { color: #829ab1; font-size: 13px; margin-bottom: 20px; }
        .auth-box input { width: 100%; padding: 12px 15px; margin-bottom: 12px; background: #242f3d; border: 1px solid #2b3847; border-radius: 10px; color: white; font-size: 15px; outline: none; }
        .auth-box button { width: 100%; padding: 12px; background: #5288c1; border: none; border-radius: 10px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; }

        /* App Screen (Telegram Layout) */
        #app-screen { display: none; height: 100vh; flex-direction: column; background: #0e1621; }
        
        /* Telegram Header */
        header { background: #17212b; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #111822; height: 56px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 38px; height: 38px; background: #5288c1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 16px; }
        .header-info h3 { font-size: 16px; color: #ffffff; }
        .header-info span { font-size: 12px; color: #22c55e; }
        .header-icons { display: flex; gap: 15px; }
        .header-icons button { background: none; border: none; color: #829ab1; font-size: 20px; cursor: pointer; }

        /* Chat Body */
        .chat-body { flex: 1; display: flex; overflow: hidden; position: relative; }
        
        /* Messages Section */
        .chat-main { flex: 1; display: flex; flex-direction: column; background: #0e1621; }
        #messages { flex: 1; padding: 15px; overflow-y: auto; list-style: none; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-all; position: relative; }
        .msg.incoming { background: #182533; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 3px; }
        .msg.outgoing { background: #2b5278; color: #f1f5f9; align-self: flex-end; border-bottom-right-radius: 3px; }
        .msg .sender { font-size: 11px; color: #64b5f6; margin-bottom: 2px; font-weight: 600; display: block; }
        .msg .time { font-size: 9px; color: #829ab1; float: right; margin-left: 8px; margin-top: 4px; }

        /* Telegram Bottom Input Bar */
        #form { background: #17212b; padding: 10px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #111822; }
        #input { flex: 1; padding: 10px 15px; background: #242f3d; border: none; border-radius: 20px; color: white; font-size: 15px; outline: none; }
        #form button { background: #5288c1; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; font-size: 18px; flex-shrink: 0; }

        /* Contacts Drawer/Sidebar for Mobile */
        #sidebar { position: absolute; left: -260px; top: 0; width: 260px; height: 100%; background: #17212b; transition: 0.3s ease; z-index: 50; border-right: 1px solid #111822; display: flex; flex-direction: column; }
        #sidebar.open { left: 0; }
        .sidebar-header { padding: 18px 15px; font-weight: bold; background: #242f3d; color: #5288c1; font-size: 15px; border-bottom: 1px solid #111822; display: flex; justify-content: space-between; align-items: center; }
        #user-list { list-style: none; overflow-y: auto; padding: 10px; flex: 1; }
        #user-list li { padding: 10px 12px; margin-bottom: 4px; background: #242f3d; border-radius: 8px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
        #user-list li::before { content: ''; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }

        /* Overlay for sidebar */
        #overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 40; }
        #overlay.show { display: block; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>PK Telegram</h2>
            <p>Password fixed hai: <b>272009</b></p>
            <form id="auth-form">
                <input type="text" id="username" placeholder="Username (e.g. Praveen)" required autocomplete="off" />
                <input type="password" id="password" placeholder="Password (272009)" required />
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen">
        <header>
            <div class="header-left">
                <button onclick="toggleSidebar()" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">☰</button>
                <div class="avatar" id="avatar-text">PK</div>
                <div class="header-info">
                    <h3 id="room-name">Global Chat</h3>
                    <span id="online-count">Online</span>
                </div>
            </div>
            <div class="header-icons">
                <button onclick="alert('Calling feature coming next!')" title="Call">📞</button>
                <button onclick="location.reload()" title="Logout">🚪</button>
            </div>
        </header>

        <div class="chat-body">
            <!-- Sidebar for Online Users -->
            <div id="sidebar">
                <div class="sidebar-header">
                    Online Users
                    <button onclick="toggleSidebar()" style="background:none; border:none; color:#829ab1; font-size:16px; cursor:pointer;">✕</button>
                </div>
                <ul id="user-list"></ul>
            </div>
            <div id="overlay" onclick="toggleSidebar()"></div>

            <!-- Chat Main Area -->
            <div class="chat-main">
                <ul id="messages"></ul>
                <form id="form">
                    <input id="input" autocomplete="off" placeholder="Write a message..." required />
                    <button type="submit">➤</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = '';

        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const authForm = document.getElementById('auth-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const userList = document.getElementById('user-list');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            myUsername = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            socket.emit('register', { username: myUsername, password }, (res) => {
                if (res.success) {
                    authScreen.style.display = 'none';
                    appScreen.style.display = 'flex';
                    document.getElementById('avatar-text').textContent = myUsername.substring(0, 2).toUpperCase();
                } else {
                    alert(res.message);
                }
            });
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                socket.emit('chat_message', { user: myUsername, text: input.value.trim() });
                input.value = '';
            }
        });

        socket.on('chat_message', (data) => {
            const item = document.createElement('li');
            item.className = data.user === myUsername ? 'msg outgoing' : 'msg incoming';
            
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            let html = '';
            if (data.user !== myUsername) {
                html += `<span class="sender">${data.user}</span>`;
            }
            html += `${data.text}<span class="time">${time}</span>`;
            
            item.innerHTML = html;
            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        });

        socket.on('update_users', (users) => {
            userList.innerHTML = '';
            document.getElementById('online-count').textContent = `${users.length} online`;
            users.forEach(u => {
                const li = document.createElement('li');
                li.textContent = u;
                userList.appendChild(li);
            });
        });

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }
    </script>
</body>
</html>
