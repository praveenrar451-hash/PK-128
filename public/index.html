<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE Messenger</title>
    <style>
        * { box-sizing: border-box; }
        body, html { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; height: 100%; overflow: hidden; }
        
        /* Login Screen */
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #008069; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .auth-box { background: white; padding: 30px; border-radius: 8px; width: 300px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .auth-box h2 { color: #008069; margin-bottom: 20px; }
        .auth-box input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        .auth-box button { width: 100%; padding: 10px; background: #008069; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; }

        /* App Screen */
        #app-screen { display: none; width: 100vw; height: 100vh; flex-direction: row; overflow: hidden; }
        
        /* Sidebar */
        #sidebar { width: 300px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; height: 100%; }
        .sidebar-top { padding: 15px; background: #f0f2f5; font-weight: bold; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        #user-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        .contact { padding: 15px; border-bottom: 1px solid #f0f2f5; cursor: pointer; font-size: 15px; }
        .contact:hover, .contact.active { background: #f5f6f6; }

        /* Chat Area */
        #chat-area { flex: 1; display: flex; flex-direction: column; height: 100%; background: #efeae2; overflow: hidden; position: relative; }
        
        /* Fixed Header */
        .chat-header { padding: 15px; background: #f0f2f5; border-bottom: 1px solid #ddd; font-weight: bold; font-size: 16px; flex-shrink: 0; display: flex; align-items: center; }
        
        #no-chat { flex: 1; display: flex; justify-content: center; align-items: center; color: #666; font-size: 16px; }
        
        #active-chat { display: none; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }
        
        /* Scrollable Messages Container Only */
        #messages { flex: 1; padding: 15px; overflow-y: auto; list-style: none; margin: 0; display: flex; flex-direction: column; gap: 8px; }
        
        .msg { max-width: 60%; padding: 10px; border-radius: 6px; font-size: 14px; word-break: break-all; }
        .msg.incoming { background: white; align-self: flex-start; }
        .msg.outgoing { background: #d9fdd3; align-self: flex-end; }
        .msg span { display: block; font-size: 10px; color: #777; margin-top: 4px; text-align: right; }

        /* Fixed Bottom Input Form */
        #form { padding: 10px 15px; background: #f0f2f5; display: flex; gap: 10px; border-top: 1px solid #ddd; flex-shrink: 0; }
        #input { flex: 1; padding: 12px; border: none; border-radius: 4px; outline: none; font-size: 14px; background: white; }
        #form button { padding: 10px 20px; background: #008069; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; }

        @media(max-width: 768px) {
            #sidebar { width: 100%; position: absolute; height: 100%; z-index: 10; }
            #sidebar.hidden { display: none; }
            #chat-area { width: 100%; height: 100%; position: absolute; }
        }
    </style>
</head>
<body>

    <!-- Login -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2>PK Messenger</h2>
            <form id="auth-form">
                <input type="text" id="username" placeholder="USERNAME" required autocomplete="off" />
                <input type="password" id="password" placeholder="Password" required />
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <!-- App -->
    <div id="app-screen">
        <div id="sidebar">
            <div class="sidebar-top">
                <span id="my-name">Contacts</span>
                <button onclick="location.reload()" style="background:#ff4d4d; border:none; color:white; padding:5px 10px; border-radius:3px; cursor:pointer;">Logout</button>
            </div>
            <ul id="user-list"></ul>
        </div>

        <div id="chat-area">
            <div id="no-chat">
                <p>Contacts in left side</p>
            </div>

            <div id="active-chat">
                <div class="chat-header">
                    <button id="back-btn" onclick="goBack()" style="display:none; margin-right:10px; background:none; border:none; font-size:18px; cursor:pointer;">⬅️</button>
                    <span id="chat-title">Chat</span>
                </div>
                
                <!-- Sirf yeh area scroll hoga -->
                <ul id="messages"></ul>

                <!-- Fixed Input Form -->
                <form id="form">
                    <input id="input" autocomplete="off" placeholder="type a massage..." required />
                    <button type="submit">SEND</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myName = '';
        let targetSocketId = null;
        let histories = {};

        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const authForm = document.getElementById('auth-form');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        
        const userList = document.getElementById('user-list');
        const noChat = document.getElementById('no-chat');
        const activeChat = document.getElementById('active-chat');
        const chatTitle = document.getElementById('chat-title');
        const messages = document.getElementById('messages');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const sidebar = document.getElementById('sidebar');
        const backBtn = document.getElementById('back-btn');

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            myName = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            socket.emit('register', { username: myName, password }, (res) => {
                if (res.success) {
                    authScreen.style.display = 'none';
                    appScreen.style.display = 'flex';
                    document.getElementById('my-name').textContent = `Hi, ${myName}`;
                } else {
                    alert(res.message);
                }
            });
        });

        socket.on('update_users', (usersMap) => {
            userList.innerHTML = '';
            for (let sId in usersMap) {
                if (usersMap[sId] === myName) continue;
                const li = document.createElement('li');
                li.className = 'contact';
                li.textContent = `🟢 ${usersMap[sId]}`;
                li.onclick = () => {
                    targetSocketId = sId;
                    chatTitle.textContent = usersMap[sId];
                    noChat.style.display = 'none';
                    activeChat.style.display = 'flex';
                    if (window.innerWidth <= 768) {
                        sidebar.classList.add('hidden');
                        backBtn.style.display = 'inline-block';
                    }
                    renderMsgs();
                };
                userList.appendChild(li);
            }
        });

        function goBack() {
            sidebar.classList.remove('hidden');
            activeChat.style.display = 'none';
            noChat.style.display = 'flex';
            targetSocketId = null;
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const txt = input.value.trim();
            if (txt && targetSocketId) {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                if (!histories[targetSocketId]) histories[targetSocketId] = [];
                histories[targetSocketId].push({ sender: myName, text: txt, time });

                socket.emit('private_message', { toSocketId: targetSocketId, message: txt, sender: myName });
                input.value = '';
                renderMsgs();
            }
        });

        socket.on('private_message', ({ sender, message, fromSocketId }) => {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            if (!histories[fromSocketId]) histories[fromSocketId] = [];
            histories[fromSocketId].push({ sender: sender, text: message, time });

            if (targetSocketId === fromSocketId) {
                renderMsgs();
            }
        });

        function renderMsgs() {
            messages.innerHTML = '';
            if (!targetSocketId || !histories[targetSocketId]) return;
            histories[targetSocketId].forEach(m => {
                const li = document.createElement('li');
                li.className = m.sender === myName ? 'msg outgoing' : 'msg incoming';
                li.innerHTML = `${m.text}<span>${m.time}</span>`;
                messages.appendChild(li);
            });
            messages.scrollTop = messages.scrollHeight;
        }
    </script>
</body>
</html>
